name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: wip-linux-x64
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: wip-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
            binary: wip-darwin-x64
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: wip-darwin-arm64
            cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: wip-windows-x64.exe
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        if: "!matrix.cross"
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/wip ${{ matrix.binary }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/wip.exe ${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            wip-linux-x64
            wip-linux-arm64
            wip-darwin-x64
            wip-darwin-arm64
            wip-windows-x64.exe
